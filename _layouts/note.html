<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <title>{{ page.title | escape }} — D.797</title>
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex2jax: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      displayAlign: "center"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-MML-AM_CHTML" defer></script>
  <script src="{{ '/script.js' | relative_url }}" defer></script>
</head>
<body data-depth="root">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="D.797's home"><span class="brand-core">D.797</span><span class="brand-home">'s home</span></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/Notes/' | relative_url }}">Notes</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main id="content" class="page-shell article-page">
    <a class="article-back article-back-top" href="{{ '/Notes/' | relative_url }}" aria-label="Back to Notes">←</a>
    <article>
      <header class="article-header">
        <h1 class="article-title reveal" style="--delay: 80ms">{{ page.title }}</h1>
        <div class="date-line reveal" style="--delay: 160ms">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg>
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b, %Y" }}</time>
        </div>
      </header>
      <div class="article-body markdown-body">{{ content }}</div>
    </article>
  </main>
</body>
</html>
